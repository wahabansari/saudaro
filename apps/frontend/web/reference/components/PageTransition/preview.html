<!-- @dsCard group="Page loader" height=520 subtitle="Route transitions on CSS view transitions: fade-rise, hero morph, fixed header." -->
<meta charset="utf-8"><style>body{padding:20px;background:var(--grey-100);color:var(--ink);min-height:100vh;box-sizing:border-box}</style>
<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px"><div class="sa-vt sa-vt--root"><div class="sa-vt__stage"><div class="sa-vt__page p1"><i class="h"></i><i></i><i></i><i class="b" style="width:40%"></i></div><div class="sa-vt__page p2"><i class="h" style="width:70%"></i><i></i><i></i><i></i></div></div><strong style="color:var(--ink)">root</strong>Page fades up and out, next page rises in</div><div class="sa-vt sa-vt--hero"><div class="sa-vt__stage"><div class="sa-vt__page"><i class="h"></i><i></i><i></i><i></i></div><div class="card"></div></div><strong style="color:var(--ink)">sa-hero</strong>Card thumbnail grows into the detail hero</div><div class="sa-vt sa-vt--head"><div class="sa-vt__stage"><div class="hd"></div><div class="sa-vt__page p1"><i class="h"></i><i></i><i class="b" style="width:50%"></i></div><div class="sa-vt__page p2"><i class="h" style="width:65%"></i><i></i><i></i></div></div><strong style="color:var(--ink)">sa-head</strong>Header stays, only the content changes</div></div><!--@live--><div class="sa-vtdemo" data-view="list" style="margin-top:20px;border:1px solid var(--grey-200);border-radius:12px;overflow:hidden;background:#fff"><header class="sa-vt-head" style="display:flex;align-items:center;gap:12px;height:56px;padding:0 16px;border-bottom:1px solid var(--grey-200);background:var(--grey-100)"><img src="../../assets/Logo/saudaro-lockup-horizontal-navy.svg" height="26" alt="SAUDARO"><span style="flex:1"></span><button class="sa-btn sa-btn--text sa-btn--sm" data-back>Back to list</button></header><div data-view="list" style="grid-template-columns:repeat(3,1fr);gap:16px;padding:16px"><button data-open style="all:unset;cursor:pointer;display:grid;gap:8px;padding:12px;border:1px solid var(--grey-200);border-radius:12px"><span class="thumb" style="display:block;height:96px;border-radius:8px;background:var(--primary-200)"></span><strong>Basmati rice 1121</strong><span style="color:var(--grey-600)">Click to open</span></button><div style="padding:12px;border:1px solid var(--grey-200);border-radius:12px;display:grid;gap:8px"><span style="display:block;height:96px;border-radius:8px;background:var(--grey-100)"></span><strong>Sesame oil</strong></div><div style="padding:12px;border:1px solid var(--grey-200);border-radius:12px;display:grid;gap:8px"><span style="display:block;height:96px;border-radius:8px;background:var(--grey-100)"></span><strong>Cotton fabric</strong></div></div><div data-view="detail" style="gap:12px;padding:16px"><span class="hero" style="display:block;height:180px;border-radius:12px;background:var(--primary-200)"></span><h3 style="margin:0">Basmati rice 1121 Steam</h3><p style="margin:0;color:var(--grey-600)">The thumbnail morphed into this hero with <code>view-transition-name: sa-hero</code>.</p></div></div><script>(function(){var r=document.querySelector('.sa-vtdemo');function go(v,el){var th=r.querySelector('.thumb'),he=r.querySelector('.hero');function swap(){r.dataset.view=v;if(v==='detail'){th.style.viewTransitionName='';he.style.viewTransitionName='sa-hero'}else{he.style.viewTransitionName='';th.style.viewTransitionName='sa-hero'}}if(!document.startViewTransition){swap();return}if(v==='detail')th.style.viewTransitionName='sa-hero';else he.style.viewTransitionName='sa-hero';var t=document.startViewTransition(swap);t.finished.finally(function(){th.style.viewTransitionName='';he.style.viewTransitionName=''})}r.querySelector('[data-open]').addEventListener('click',function(){go('detail')});r.querySelector('[data-back]').addEventListener('click',function(){go('list')})})();</script><!--@endlive-->
