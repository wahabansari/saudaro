global:
  scrape_interval: 15s

scrape_configs:
  - job_name: api-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ['api-gateway:4000']
  - job_name: identity-service
    metrics_path: /metrics
    static_configs:
      - targets: ['identity-service:4001']
  - job_name: company-service
    metrics_path: /metrics
    static_configs:
      - targets: ['company-service:4002']
